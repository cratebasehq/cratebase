[package]
name = "cratebase-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cratebase"
path = "src/main.rs"

[dependencies]
cratebase-core.workspace = true
cratebase-filter.workspace = true
cratebase-db.workspace = true
cratebase-storage.workspace = true
cratebase-auth.workspace = true
cratebase-mailer.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
futures.workspace = true
bytes.workspace = true
async-trait.workspace = true

axum = { version = "0.8", features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio-util = { version = "0.7", features = ["io"] }
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
mime_guess = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rust-embed = { version = "8", features = ["mime-guess", "interpolate-folder-path"] }
croner = { version = "4.0.0", features = ["chrono"] }
arc-swap = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
walkdir = "2"
jsonwebtoken = "9"
mimalloc = "0.1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
