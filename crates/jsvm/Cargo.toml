[package]
name = "cratebase-jsvm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedded QuickJS runtime hosting PocketBase-style pb_hooks and pb_migrations"

[dependencies]
cratebase-core.workspace = true

rquickjs = { version = "0.12", default-features = false, features = ["std"] }

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
futures.workspace = true
rand.workspace = true

crossbeam-channel = "0.5"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
