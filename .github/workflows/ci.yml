name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cratebase
          POSTGRES_PASSWORD: cratebase
          POSTGRES_DB: cratebase_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cratebase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # rust-embed needs `web/admin/dist` and `web/email/dist` to exist
      # even for a non-dashboard build/test run (see
      # crates/server/src/dashboard.rs and crates/server/src/mail.rs).
      - run: mkdir -p web/admin/dist web/email/dist && touch web/admin/dist/.gitkeep
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
        env:
          TEST_POSTGRES_URL: postgres://cratebase:cratebase@localhost:5432/cratebase_test

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, because the dashboard bundle is committed and CI
          # byte-compares a fresh build against it. A different Bun emits
          # different minified output and different content hashes, which
          # would fail the drift check on every run for no real reason.
          bun-version: 1.4.0
      - run: bun install
      - run: bunx tsc -b
        working-directory: web/admin
      - run: bun run admin:build
      - run: bun run --cwd web/admin lint
      # `web/admin/dist` is committed so that `cargo build` alone yields a
      # working binary. That only holds if what is committed matches the
      # source, or a release ships a dashboard nobody can reproduce.
      - name: The committed bundle must match a fresh build
        run: |
          if ! git diff --quiet -- web/admin/dist; then
            echo "::error::web/admin/dist is stale. Run 'bun run admin:build' and commit the result."
            git diff --stat -- web/admin/dist
            exit 1
          fi

  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, because the dashboard bundle is committed and CI
          # byte-compares a fresh build against it. A different Bun emits
          # different minified output and different content hashes, which
          # would fail the drift check on every run for no real reason.
          bun-version: 1.4.0
      - run: bun install
        working-directory: web/email
      - run: bun run build
        working-directory: web/email

  docker:
    runs-on: ubuntu-latest
    needs: [rust, dashboard, email]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cratebase:ci
