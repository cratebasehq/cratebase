name: Publish @cratebase/schema

# @cratebase/schema versions independently from the server binary and from
# the other npm packages: it's an optional schema-as-code DSL, not a build
# artifact of the Rust workspace. `schema-v*` keeps this release train
# independent while using the same "push a tag" mechanism as the others.
on:
  push:
    tags: ["schema-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for a dry run)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js/schema
    steps:
      - uses: actions/checkout@v4

      # `npm publish` (not `bun publish`) so that credentials come from
      # this standard action's generated `.npmrc` (reading
      # `NODE_AUTH_TOKEN`).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun run test

      # The package version must match the tag, or a publish could
      # silently ship the wrong version.
      - name: Verify package.json version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#schema-v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag schema-v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --dry-run

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
