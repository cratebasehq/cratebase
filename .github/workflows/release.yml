name: Release

# Cutting a release means pushing a tag. Everything a user needs is then
# one file: the dashboard is compiled into the binary and the database is
# created on first run, so `./cratebase serve` is the whole install.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for a dry run)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The bundle is committed, but a release is the worst possible moment to
  # find out it drifted from source. Rebuild and compare before building
  # anything else.
  dashboard-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run admin:build
      - name: The committed bundle must match a fresh build
        run: |
          if ! git diff --quiet -- web/admin/dist; then
            echo "::error::web/admin/dist is stale. Run 'bun run admin:build' and commit the result."
            git diff --stat -- web/admin/dist
            exit 1
          fi

  build:
    needs: dashboard-is-current
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl so the Linux builds are static and run on any distro,
          # which is the whole point of shipping one file.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release -p cratebase-server --target ${{ matrix.target }}
          else
            cargo build --release -p cratebase-server --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "${{ inputs.tag }}" ] && version="${{ inputs.tag }}"
          name="cratebase_${version}_${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/cratebase.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/cratebase" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/" 2>/dev/null || true
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a -tzip "$name.zip" "$name"
          else
            zip -r "$name.zip" "$name"
          fi
          # A checksum beside each archive, so a download can be verified.
          shasum -a 256 "$name.zip" > "$name.zip.sha256" 2>/dev/null \
            || sha256sum "$name.zip" > "$name.zip.sha256"

      - name: Smoke test the artifact
        # A binary that cannot start is not a release. Only runs where the
        # runner can execute what we just built.
        if: matrix.target == 'x86_64-unknown-linux-musl' || (!matrix.cross && matrix.os != 'windows-latest')
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/cratebase"
          "$bin" --version
          dir="$(mktemp -d)"
          CRATEBASE_DATA_DIR="$dir" DATABASE_URL="sqlite://$dir/data.db" \
            "$bin" superuser create smoke@example.com smokepassword123
          CRATEBASE_DATA_DIR="$dir" DATABASE_URL="sqlite://$dir/data.db" PORT=8099 \
            "$bin" serve &
          pid=$!
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8099/api/health > /dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8099/api/health
          # The dashboard must be embedded, not just routed: fetch the
          # shell and then the script it asks for.
          asset=$(curl -sf http://127.0.0.1:8099/_/ | grep -o '/_/assets/[^"]*\.js' | head -1)
          test -n "$asset" || { echo "no dashboard asset referenced"; exit 1; }
          curl -sf "http://127.0.0.1:8099$asset" > /dev/null
          kill $pid

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.zip*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Download the archive for your platform, unzip it, and run:

            ```
            ./cratebase superuser create you@example.com yourpassword
            ./cratebase serve
            ```

            The admin dashboard is at http://127.0.0.1:8090/_/ and the API
            at http://127.0.0.1:8090/api/. The database is created on first
            run; there is nothing else to install.

            Each archive has a matching `.sha256` to verify the download.
