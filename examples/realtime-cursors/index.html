<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cratebase — Realtime Cursors</title>
  <script type="importmap">
    { "imports": { "pocketbase": "https://esm.sh/pocketbase@0.28" } }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg-0: #06070d;
      --bg-1: #0b0e19;
      --grid: rgba(148, 163, 255, 0.06);
      --ink: #e9ecff;
      --ink-dim: #8891b5;
      --accent: #7c9dff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-0);
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      cursor: none;
    }

    #field {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(1200px 800px at 15% 10%, rgba(124, 157, 255, 0.14), transparent 60%),
        radial-gradient(900px 700px at 85% 85%, rgba(255, 124, 214, 0.10), transparent 60%),
        linear-gradient(180deg, var(--bg-1), var(--bg-0));
      background-attachment: fixed;
    }

    #field::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      pointer-events: none;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    .brand span {
      font-size: 12px;
      color: var(--ink-dim);
    }

    #status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--ink-dim);
      background: rgba(15, 18, 32, 0.6);
      border: 1px solid rgba(148, 163, 255, 0.12);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 999px;
      pointer-events: auto;
    }

    #status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px 1px rgba(239, 68, 68, 0.6);
      transition: background 0.2s, box-shadow 0.2s;
    }

    #status.live .dot {
      background: #34d399;
      box-shadow: 0 0 8px 1px rgba(52, 211, 153, 0.65);
    }

    #hint {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--ink-dim);
      background: rgba(15, 18, 32, 0.6);
      border: 1px solid rgba(148, 163, 255, 0.12);
      backdrop-filter: blur(10px);
      padding: 9px 16px;
      border-radius: 999px;
      z-index: 20;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    #hint.fade { opacity: 0; }

    #self-badge {
      position: fixed;
      top: 18px;
      right: 24px;
      display: none;
    }

    .cursor {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 30;
      pointer-events: none;
      will-change: transform;
      transition: transform 90ms linear;
    }

    .cursor svg {
      display: block;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
    }

    .cursor .label {
      position: absolute;
      top: 20px;
      left: 18px;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 600;
      color: #0a0a0f;
      padding: 3px 9px;
      border-radius: 8px 8px 8px 2px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      letter-spacing: 0.01em;
    }

    .cursor.stale { opacity: 0.35; }

    #count-pill {
      position: fixed;
      top: 18px;
      right: 24px;
      font-size: 12px;
      color: var(--ink-dim);
      background: rgba(15, 18, 32, 0.6);
      border: 1px solid rgba(148, 163, 255, 0.12);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 999px;
      z-index: 20;
      pointer-events: none;
    }

    #count-pill strong {
      color: var(--ink);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="field"></div>

  <header>
    <div class="brand">
      <h1>Cratebase</h1>
      <span>realtime cursors</span>
    </div>
    <div id="status"><span class="dot"></span><span id="status-text">connecting…</span></div>
  </header>

  <div id="count-pill"><strong id="count">1</strong> watching</div>

  <div id="hint">move your mouse — everyone here sees it live</div>

  <div id="cursors-layer"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
