# A minimal, real WASM plugin proving Cratebase's plugin pipeline end
# to end. Build with:
#
#   cargo build --release --target wasm32-unknown-unknown
#   cp target/wasm32-unknown-unknown/release/wasm_plugin_hello.wasm plugin.wasm
#
# then `cratebase plugin install examples/wasm-plugin-hello`.
#
# Deliberately its own tiny workspace (`[workspace]` below) so it never
# affects the main Cratebase workspace's dependency resolution or
# build — it targets `wasm32-unknown-unknown`, the main workspace
# targets the host.
[package]
name = "wasm-plugin-hello"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[workspace]
