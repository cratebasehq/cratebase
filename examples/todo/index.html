<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cratebase Todo</title>
    <script type="importmap">
      { "imports": { "pocketbase": "https://esm.sh/pocketbase@0.28" } }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink-950: #0a0c12;
        --ink-900: #12151d;
        --ink-850: #1a1f2b;
        --ink-800: #212736;
        --line: #262c3a;
        --fg: #edf0f7;
        --fg-dim: #838da3;
        --violet: #8b7bff;
        --violet-dim: #5d51a8;
        --mint: #34d399;
        --rose: #fb7185;
        --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(ellipse 900px 500px at 15% -10%, rgba(139, 123, 255, 0.14), transparent),
          var(--ink-950);
        color: var(--fg);
        font-family: var(--sans);
        display: flex;
        justify-content: center;
        padding: 40px 20px 120px;
      }

      .app {
        width: 100%;
        max-width: 480px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .brand .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--violet);
        box-shadow: 0 0 0 4px rgba(139, 123, 255, 0.18);
        flex: none;
      }

      .brand h1 {
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 600;
        margin: 0;
        letter-spacing: -0.01em;
      }

      .brand h1 .slash {
        color: var(--fg-dim);
        font-weight: 400;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--fg-dim);
      }

      .status .led {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--fg-dim);
        flex: none;
      }

      .status[data-state="connected"] .led {
        background: var(--mint);
        box-shadow: 0 0 6px rgba(52, 211, 153, 0.7);
      }

      .status[data-state="error"] .led,
      .status[data-state="disconnected"] .led {
        background: var(--rose);
      }

      .whoami {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--fg-dim);
      }

      .whoami button {
        background: none;
        border: 1px solid var(--line);
        color: var(--fg-dim);
        border-radius: 6px;
        padding: 5px 10px;
        font-family: var(--mono);
        font-size: 11px;
        cursor: pointer;
      }

      .whoami button:hover {
        border-color: var(--rose);
        color: var(--rose);
      }

      #banner {
        display: none;
        background: rgba(251, 113, 133, 0.1);
        border: 1px solid rgba(251, 113, 133, 0.35);
        color: #ffb4bf;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
        margin-bottom: 16px;
      }

      #banner.visible {
        display: block;
      }

      .card {
        background: var(--ink-900);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 22px;
      }

      /* --- auth card --- */

      .tabs {
        display: flex;
        gap: 4px;
        background: var(--ink-950);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 3px;
        margin-bottom: 18px;
      }

      .tab {
        flex: 1;
        background: none;
        border: none;
        color: var(--fg-dim);
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 500;
        padding: 8px 0;
        border-radius: 7px;
        cursor: pointer;
      }

      .tab.active {
        background: var(--ink-800);
        color: var(--fg);
      }

      .auth-form label {
        display: block;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--fg-dim);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin: 14px 0 6px;
      }

      .auth-form label:first-of-type {
        margin-top: 0;
      }

      .auth-form input {
        width: 100%;
        background: var(--ink-850);
        border: 1px solid var(--line);
        color: var(--fg);
        border-radius: 8px;
        padding: 10px 12px;
        font-family: var(--sans);
        font-size: 14px;
        outline: none;
      }

      .auth-form input:focus {
        border-color: var(--violet);
      }

      .auth-form button {
        width: 100%;
        margin-top: 20px;
        background: var(--violet);
        color: #0e0b1f;
        border: none;
        border-radius: 8px;
        padding: 11px 0;
        font-family: var(--mono);
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }

      .auth-form button:hover {
        filter: brightness(1.08);
      }

      .auth-form button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      /* --- todo card --- */

      #composer {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }

      #composer input {
        flex: 1;
        background: var(--ink-850);
        border: 1px solid var(--line);
        color: var(--fg);
        border-radius: 8px;
        padding: 11px 13px;
        font-family: var(--sans);
        font-size: 14px;
        outline: none;
      }

      #composer input:focus {
        border-color: var(--violet);
      }

      #composer button {
        background: var(--violet);
        color: #0e0b1f;
        border: none;
        border-radius: 8px;
        padding: 0 18px;
        font-family: var(--mono);
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }

      .empty {
        color: var(--fg-dim);
        font-size: 13px;
        text-align: center;
        padding: 30px 0;
      }

      ul#list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      li.todo {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--ink-850);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 11px 12px;
        transition:
          opacity 220ms ease,
          transform 220ms ease;
      }

      li.todo.removing {
        opacity: 0;
        transform: translateX(6px);
      }

      .checkbox-wrap {
        position: relative;
        width: 18px;
        height: 18px;
        flex: none;
        cursor: pointer;
      }

      .checkbox-wrap input {
        position: absolute;
        opacity: 0;
        inset: 0;
        margin: 0;
        cursor: pointer;
      }

      .checkbox-wrap .mark {
        display: block;
        width: 18px;
        height: 18px;
        border: 1.5px solid var(--line);
        border-radius: 5px;
        background: var(--ink-900);
      }

      .checkbox-wrap input:checked + .mark {
        background: var(--mint);
        border-color: var(--mint);
      }

      .checkbox-wrap input:checked + .mark::after {
        content: "";
        display: block;
        width: 5px;
        height: 9px;
        border-right: 2px solid #0a0c12;
        border-bottom: 2px solid #0a0c12;
        transform: rotate(45deg);
        margin: 2px 0 0 6px;
      }

      li.todo.done .title {
        color: var(--fg-dim);
        text-decoration: line-through;
      }

      .title {
        flex: 1;
        font-size: 14px;
        word-break: break-word;
      }

      .delete {
        background: none;
        border: none;
        color: var(--fg-dim);
        font-size: 16px;
        line-height: 1;
        padding: 4px 6px;
        cursor: pointer;
        border-radius: 6px;
      }

      .delete:hover {
        color: var(--rose);
        background: rgba(251, 113, 133, 0.1);
      }

      .hidden {
        display: none !important;
      }

      .form-status {
        margin-top: 14px;
        font-size: 13px;
        border-radius: 8px;
        padding: 9px 12px;
      }

      .form-status.err {
        background: rgba(251, 113, 133, 0.1);
        color: #ffb4bf;
        border: 1px solid rgba(251, 113, 133, 0.3);
      }

      .form-status.ok {
        background: rgba(52, 211, 153, 0.1);
        color: #6ee7b7;
        border: 1px solid rgba(52, 211, 153, 0.3);
      }

      /* --- request ticker: the signature element. Every SDK call this
         page makes flashes here as method + path + status, so the auth
         and CRUD flows are never a black box. --- */

      .ticker {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: center;
        padding: 14px 20px;
        pointer-events: none;
      }

      .ticker span {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--fg-dim);
        background: var(--ink-900);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 14px;
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 200ms ease,
          transform 200ms ease;
        max-width: 90vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ticker span.show {
        opacity: 1;
        transform: translateY(0);
      }

      .ticker .m {
        font-weight: 600;
      }

      .ticker .m-GET {
        color: var(--mint);
      }

      .ticker .m-POST {
        color: #60a5fa;
      }

      .ticker .m-PATCH {
        color: #fbbf24;
      }

      .ticker .m-DELETE {
        color: var(--rose);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="brand">
          <span class="dot"></span>
          <h1>cratebase<span class="slash">/</span>todo</h1>
        </div>
        <div class="header-right">
          <div id="status" class="status" data-state="disconnected">
            <span class="led"></span>
            <span id="statusText">signed out</span>
          </div>
          <div id="whoami" class="whoami hidden">
            <span id="whoamiEmail"></span>
            <button id="btn-logout" type="button">Sign out</button>
          </div>
        </div>
      </header>

      <div id="banner"></div>

      <!-- ================= GUEST: sign in / register ================= -->
      <section id="view-guest" class="card">
        <div class="tabs">
          <button type="button" class="tab active" data-tab="login">Sign in</button>
          <button type="button" class="tab" data-tab="register">Create account</button>
        </div>

        <form id="form-login" class="auth-form">
          <label>Email</label>
          <input name="identity" type="email" required autocomplete="email" />
          <label>Password</label>
          <input name="password" type="password" required autocomplete="current-password" />
          <button type="submit">Sign in →</button>
        </form>

        <form id="form-register" class="auth-form hidden">
          <label>Email</label>
          <input name="email" type="email" required autocomplete="email" />
          <label>Password</label>
          <input name="password" type="password" required minlength="8" autocomplete="new-password" />
          <label>Confirm password</label>
          <input name="passwordConfirm" type="password" required minlength="8" autocomplete="new-password" />
          <button type="submit">Create account →</button>
        </form>

        <div class="form-status hidden" id="status-auth"></div>
      </section>

      <!-- ================= AUTHENTICATED: todo list ================= -->
      <section id="view-todos" class="card hidden">
        <form id="composer" autocomplete="off">
          <input id="title" type="text" maxlength="200" placeholder="What needs doing?" required />
          <button id="add" type="submit">Add</button>
        </form>

        <div class="empty" id="emptyState">Loading…</div>
        <ul id="list"></ul>
      </section>
    </div>

    <div class="ticker"><span id="tickerText"></span></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
