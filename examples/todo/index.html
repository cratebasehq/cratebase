<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cratebase Todo</title>
    <script type="importmap">
      { "imports": { "cratebase": "../../sdk/js/dist/index.js" } }
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #161923;
        --panel-2: #1d212e;
        --border: #2a2f3d;
        --text: #e7e9ee;
        --muted: #8a90a3;
        --accent: #6c8dff;
        --accent-2: #8f6cff;
        --danger: #ff6c7c;
        --success: #58e08c;
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background:
          radial-gradient(1200px 600px at 15% -10%, rgba(108, 141, 255, 0.16), transparent),
          radial-gradient(1000px 500px at 100% 0%, rgba(143, 108, 255, 0.12), transparent), var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .app {
        width: 100%;
        max-width: 520px;
        height: min(680px, 92vh);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      header {
        padding: 18px 22px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: linear-gradient(180deg, rgba(108, 141, 255, 0.08), transparent);
      }

      header .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      header .brand .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 4px rgba(108, 141, 255, 0.18);
      }

      header .brand h1 {
        font-size: 15px;
        margin: 0;
        font-weight: 600;
        letter-spacing: 0.2px;
      }

      header .status {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      header .status .led {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
        transition: background 0.2s ease;
      }

      header .status[data-state="connected"] .led {
        background: var(--success);
        box-shadow: 0 0 8px rgba(88, 224, 140, 0.7);
      }

      header .status[data-state="error"] .led {
        background: var(--danger);
        box-shadow: 0 0 8px rgba(255, 108, 124, 0.7);
      }

      form#composer {
        display: flex;
        gap: 10px;
        padding: 16px 22px;
        border-bottom: 1px solid var(--border);
        background: var(--panel-2);
      }

      form#composer input[type="text"] {
        flex: 1;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        padding: 11px 14px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s ease;
      }

      form#composer input[type="text"]:focus {
        border-color: var(--accent);
      }

      form#composer button {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #0d0f14;
        border: none;
        border-radius: 10px;
        padding: 0 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.1s ease,
          opacity 0.15s ease;
      }

      form#composer button:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      form#composer button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      main {
        flex: 1;
        overflow-y: auto;
        padding: 10px 14px;
        position: relative;
      }

      main::-webkit-scrollbar {
        width: 8px;
      }

      main::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 8px;
      }

      ul#list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .empty {
        margin: 60px auto 0;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
        max-width: 300px;
      }

      .todo {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 12px;
        border-radius: 10px;
        border: 1px solid transparent;
        background: var(--panel-2);
        animation: rise 0.18s ease-out;
        transition:
          background 0.2s ease,
          border-color 0.2s ease,
          opacity 0.2s ease,
          transform 0.2s ease,
          max-height 0.22s ease,
          margin 0.22s ease,
          padding 0.22s ease;
      }

      .todo:hover {
        border-color: var(--border);
      }

      .todo.removing {
        opacity: 0;
        transform: translateX(12px) scale(0.98);
        max-height: 0;
        margin: 0;
        padding-top: 0;
        padding-bottom: 0;
        overflow: hidden;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .checkbox-wrap {
        position: relative;
        width: 20px;
        height: 20px;
        flex: none;
        cursor: pointer;
      }

      .checkbox-wrap .checkbox {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }

      .checkbox-wrap .mark {
        position: absolute;
        inset: 0;
        border-radius: 6px;
        border: 1.5px solid var(--border);
        background: var(--bg);
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          transform 0.1s ease;
      }

      .checkbox-wrap .mark::after {
        content: "";
        position: absolute;
        left: 6px;
        top: 2px;
        width: 5px;
        height: 10px;
        border: solid #0d0f14;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg) scale(0);
        transform-origin: center;
        transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .checkbox-wrap .checkbox:checked + .mark {
        background: linear-gradient(135deg, var(--accent), var(--success));
        border-color: transparent;
      }

      .checkbox-wrap .checkbox:checked + .mark::after {
        transform: rotate(45deg) scale(1);
      }

      .checkbox-wrap .checkbox:active + .mark {
        transform: scale(0.9);
      }

      .todo .title {
        flex: 1;
        font-size: 14px;
        line-height: 1.4;
        word-break: break-word;
        transition:
          color 0.2s ease,
          opacity 0.2s ease;
      }

      .todo.done .title {
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-color: var(--muted);
        opacity: 0.75;
      }

      .todo .delete {
        flex: none;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        opacity: 0;
        transition:
          opacity 0.15s ease,
          background 0.15s ease,
          color 0.15s ease;
      }

      .todo:hover .delete,
      .todo .delete:focus-visible {
        opacity: 1;
      }

      .todo .delete:hover {
        background: rgba(255, 108, 124, 0.15);
        color: var(--danger);
      }

      #banner {
        display: none;
        padding: 8px 22px;
        font-size: 12px;
        background: rgba(255, 108, 124, 0.12);
        color: var(--danger);
        border-bottom: 1px solid var(--border);
      }

      #banner.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="brand">
          <span class="dot"></span>
          <h1>Cratebase Todo</h1>
        </div>
        <div id="status" class="status" data-state="connecting">
          <span class="led"></span>
          <span id="statusText">connecting…</span>
        </div>
      </header>

      <div id="banner"></div>

      <form id="composer" autocomplete="off">
        <input id="title" type="text" maxlength="200" placeholder="What needs doing?" required />
        <button id="add" type="submit">Add</button>
      </form>

      <main>
        <div class="empty" id="emptyState">Loading…</div>
        <ul id="list"></ul>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
