[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cratebase"
version = "0.1.0"
description = "Python SDK for Cratebase (a PocketBase-shaped Rust backend): dynamic collections, auth, realtime, files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Cratebase" }]
keywords = ["cratebase", "pocketbase", "sdk", "backend"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/cratebase/cratebase"
Repository = "https://github.com/cratebase/cratebase"

[tool.hatch.build.targets.wheel]
packages = ["src/cratebase"]

[tool.mypy]
python_version = "3.9"
strict = true
