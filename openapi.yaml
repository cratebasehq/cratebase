openapi: 3.0.3
info:
  title: Cratebase API
  version: "0.1.0"
  description: >
    Dynamic collections, auth, file storage, and realtime over one REST API.
    Error responses always use the shape in `ErrorBody`. Bearer tokens
    (admin or auth-collection) go in `Authorization: Bearer <token>`.
servers:
  - url: /api
security:
  - bearerAuth: []
  - {}
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, example: ok } }

  /setup/status:
    get:
      summary: Whether the instance still needs its first superuser (first-run only)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { needsSetup: { type: boolean } }

  /setup:
    post:
      summary: Create the first superuser (`_superusers` record). Permanently closed once any superuser exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, passwordConfirm]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                passwordConfirm: { type: string }
      responses:
        "200": { description: Created, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403":
          description: A superuser already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /batch:
    post:
      summary: Run several record create/update/upsert/delete calls in one HTTP round trip and one SQL transaction
      description: >
        `application/json` (`{"requests": [...]}`) when no sub-request
        uploads a file, or `multipart/form-data` with a `@jsonPayload`
        part plus `requests.<index>.<field>` file parts otherwise — the
        shape the official SDK's `createBatch()` always sends. Each
        sub-request is itself one of the record endpoints:
        `POST .../records` (create), `PATCH .../records/{id}` (update),
        `PUT .../records` (upsert, id read from the body), or
        `DELETE .../records/{id}`. All sub-requests commit together or
        not at all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requests]
              properties:
                requests:
                  type: array
                  items:
                    type: object
                    required: [method, url]
                    properties:
                      method: { type: string, enum: [POST, PATCH, PUT, DELETE] }
                      url: { type: string, description: "e.g. /collections/posts/records" }
                      headers: { type: object, additionalProperties: { type: string } }
                      body: { type: object, additionalProperties: true }
          multipart/form-data:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Every sub-request succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      type: object
                      properties:
                        status: { type: integer }
                        body: { type: object, nullable: true, additionalProperties: true }
        "400":
          description: >
            The whole batch was rejected, or one sub-request failed and
            rolled back every other one — the failing sub-request's own
            `{status, message, data}` is nested at
            `data.requests["<index>"].response`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "403": { $ref: "#/components/responses/Error" }

  /collections:
    get:
      summary: List collections (superuser only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Collection" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a collection (superuser only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionInput" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /collections/{idOrName}:
    parameters:
      - name: idOrName
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get a collection (superuser only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Update a collection's schema/rules (superuser only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a collection and every record in it (superuser only)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /collections/{idOrName}/records:
    parameters:
      - name: idOrName
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List/search records
      parameters:
        - name: filter
          in: query
          schema: { type: string }
          description: 'Filter expression, e.g. `published = true && title ~ "hello"`'
        - name: sort
          in: query
          schema: { type: string }
          description: Comma-separated fields, `-` prefix for descending (default `-created`)
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, default: 30, maximum: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  perPage: { type: integer }
                  totalItems: { type: integer }
                  totalPages: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Record" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a record (JSON, or multipart/form-data when the collection has file fields)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          multipart/form-data:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /collections/{idOrName}/records/{id}:
    parameters:
      - name: idOrName
        in: path
        required: true
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: View one record
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Update a record (JSON, or multipart/form-data for file fields)
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          multipart/form-data:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a record
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /collections/{idOrName}/auth-with-password:
    parameters:
      - name: idOrName
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Log in to an auth collection (superuser login is the same endpoint with idOrName=_superusers)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity, password]
              properties:
                identity: { type: string, description: "Matched against passwordAuth.identityFields (email by default)" }
                password: { type: string }
                identityField: { type: string, description: "Pin the lookup to one identity field instead of trying each in order" }
                mfaId: { type: string, description: "A pending MFA session id from a previous 401 {mfaId} response" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  record: { $ref: "#/components/schemas/Record" }
        "401":
          description: >
            Wrong credentials, or a pending MFA challenge: `{"mfaId": "..."}`
            with no `status`/`message`/`data` envelope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /collections/{idOrName}/auth-refresh:
    parameters:
      - name: idOrName
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Refresh an auth-collection token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  record: { $ref: "#/components/schemas/Record" }
        "401": { $ref: "#/components/responses/Error" }

  /collections/{idOrName}/auth-methods:
    parameters:
      - name: idOrName
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Which auth methods this collection has enabled
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  password: { type: object, properties: { enabled: { type: boolean }, identityFields: { type: array, items: { type: string } } } }
                  oauth2: { type: object, properties: { enabled: { type: boolean }, providers: { type: array, items: { type: object } } } }
                  mfa: { type: object, properties: { enabled: { type: boolean }, duration: { type: integer } } }
                  otp: { type: object, properties: { enabled: { type: boolean }, duration: { type: integer } } }
        "404": { $ref: "#/components/responses/Error" }

  /collections/{idOrName}/request-verification:
    parameters:
      - name: idOrName
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Email a one-time link to verify a record's address
      security: []
      description: Always answers 204, even for an unknown address, so a caller can't enumerate accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        "204": { description: OK }

  /collections/{idOrName}/confirm-verification:
    parameters:
      - name: idOrName
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Consume a verification token and mark the record verified
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "204": { description: OK }
        "400": { $ref: "#/components/responses/Error" }

  /collections/{idOrName}/request-password-reset:
    parameters:
      - name: idOrName
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Email a one-time password-reset link
      security: []
      description: Always answers 204, even for an unknown address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        "204": { description: OK }

  /collections/{idOrName}/confirm-password-reset:
    parameters:
      - name: idOrName
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Consume a password-reset token and set a new password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, passwordConfirm]
              properties:
                token: { type: string }
                password: { type: string }
                passwordConfirm: { type: string }
      responses:
        "204": { description: OK }
        "400": { $ref: "#/components/responses/Error" }

  /collections/{idOrName}/request-email-change:
    parameters:
      - name: idOrName
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Email a confirmation link to a pending new address (authenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [newEmail], properties: { newEmail: { type: string, format: email } } }
      responses:
        "204": { description: OK }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /collections/{idOrName}/confirm-email-change:
    parameters:
      - name: idOrName
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Consume an email-change token; the acting record comes from the token, not from Authorization
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, description: "The record's current password, checked as a second factor" }
      responses:
        "204": { description: OK }
        "400": { $ref: "#/components/responses/Error" }

  /collections/{idOrName}/request-otp:
    parameters:
      - name: idOrName
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Email a one-time login code
      security: []
      description: Always returns a well-formed otpId, even for an unknown address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { otpId: { type: string } } }

  /collections/{idOrName}/auth-with-otp:
    parameters:
      - name: idOrName
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Complete a one-time-code login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otpId, password]
              properties:
                otpId: { type: string }
                password: { type: string, description: "The emailed one-time code" }
                mfaId: { type: string, description: "A pending MFA session id from a previous 401 {mfaId} response" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  record: { $ref: "#/components/schemas/Record" }
        "400": { $ref: "#/components/responses/Error" }
        "401":
          description: 'A pending MFA challenge: `{"mfaId": "..."}` with no status/message/data envelope'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /collections/{idOrName}/impersonate/{id}:
    parameters:
      - name: idOrName
        in: path
        required: true
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Superuser-only — mint a non-refreshable session token for another record
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                duration: { type: integer, description: "Token lifetime in seconds; defaults to the collection's authToken.duration" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  record: { $ref: "#/components/schemas/Record" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /files/{collection}/{recordId}/{filename}:
    parameters:
      - name: collection
        in: path
        required: true
        schema: { type: string }
      - name: recordId
        in: path
        required: true
        schema: { type: string }
      - name: filename
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Download a file (gated by the collection's viewRule)
      responses:
        "200":
          description: OK
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /realtime:
    get:
      summary: Open an SSE stream of record change events
      description: >
        The first event (`PB_CONNECT`) carries `{"clientId": "..."}`. Send
        that id to `POST /realtime` to declare subscriptions. Subsequent
        `message` events carry `{"action": "create"|"update"|"delete", "record": {...}}`.
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream: { schema: { type: string } }
    post:
      summary: Set a client's realtime subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, subscriptions]
              properties:
                clientId: { type: string }
                subscriptions:
                  type: array
                  items: { type: string }
                  description: Bare collection name (all changes) or `collection/recordId` (one record)
      responses:
        "204": { description: OK }
        "404": { description: Unknown clientId (connection already closed) }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
  schemas:
    ErrorBody:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          additionalProperties:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
          description: Per-field validation errors, present when code is 400
    Record:
      type: object
      description: Every record has these plus its collection's own schema fields.
      properties:
        id: { type: string }
        created: { type: string }
        updated: { type: string }
        collectionId: { type: string }
        collectionName: { type: string }
      additionalProperties: true
    FieldSchema:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [text, editor, number, bool, email, url, date, select, json, relation, file, password]
        required: { type: boolean }
        unique: { type: boolean }
        options: { type: object, additionalProperties: true }
    CollectionInput:
      type: object
      required: [name, type, schema]
      properties:
        name: { type: string }
        type: { type: string, enum: [base, auth, view] }
        schema:
          type: array
          items: { $ref: "#/components/schemas/FieldSchema" }
        listRule: { type: string, nullable: true }
        viewRule: { type: string, nullable: true }
        createRule: { type: string, nullable: true }
        updateRule: { type: string, nullable: true }
        deleteRule: { type: string, nullable: true }
        authOptions: { type: object, additionalProperties: true }
    Collection:
      allOf:
        - $ref: "#/components/schemas/CollectionInput"
        - type: object
          properties:
            id: { type: string }
            created: { type: string }
            updated: { type: string }
